server.port=9876

spring.application.name=spring-cloud-26-gateway

spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.server-addr=${spring.cloud.nacos.server-addr}

spring.cloud.gateway.routes[0].id=provider-via-nacos
spring.cloud.gateway.routes[0].uri=lb://spring-cloud-26-provider
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**

spring.cloud.gateway.routes[1].id=consumer-feign-via-nacos
spring.cloud.gateway.routes[1].uri=lb://spring-cloud-26-consumer
spring.cloud.gateway.routes[1].predicates[0]=Path=/feign/**

spring.cloud.gateway.httpclient.connect-timeout=60000
spring.cloud.gateway.httpclient.response-timeout=60s

logging.level.org.springframework.cloud.loadbalancer=info
