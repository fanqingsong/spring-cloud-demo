# Docker Compose 演示（本课）
# 在仓库根目录或本课目录执行：
#   docker compose up --build -d
# 停止并清理：
#   docker compose down -v

name: spring-cloud-26

services:
  nacos:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
  provider:
    restart: unless-stopped

    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-26
        MODULE: spring-cloud-26-provider
    environment:
      NACOS_SERVER_ADDR: "nacos:8848"
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "7777:7777"
  consumer:
    restart: unless-stopped

    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-26
        MODULE: spring-cloud-26-consumer
    environment:
      NACOS_SERVER_ADDR: "nacos:8848"
    depends_on:
      nacos:
        condition: service_healthy
      provider:
        condition: service_started
    ports:
      - "8888:8888"
  gateway:
    restart: unless-stopped

    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-26
        MODULE: spring-cloud-26-gateway
    environment:
      NACOS_SERVER_ADDR: "nacos:8848"
    depends_on:
      nacos:
        condition: service_healthy
      provider:
        condition: service_started
      consumer:
        condition: service_started
    ports:
      - "9876:9876"
