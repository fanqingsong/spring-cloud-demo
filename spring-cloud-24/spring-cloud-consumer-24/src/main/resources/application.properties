server.port=7779
spring.application.name=spring-cloud-consumer

spring.config.import=optional:configserver:http://config:config-secret@localhost:8888

eureka.client.service-url.defaultZone=http://roncoo:123456@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.security.oauth2.client.registration.demo-client.provider=spring
spring.security.oauth2.client.registration.demo-client.client-id=demo-client
spring.security.oauth2.client.registration.demo-client.client-secret=demo-secret
spring.security.oauth2.client.registration.demo-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.demo-client.scope=api.read
spring.security.oauth2.client.provider.spring.issuer-uri=http://localhost:9000

spring.cloud.openfeign.oauth2.enabled=true
spring.cloud.openfeign.oauth2.clientRegistrationId=demo-client
spring.cloud.openfeign.circuitbreaker.enabled=true

management.endpoints.web.exposure.include=health,info
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
