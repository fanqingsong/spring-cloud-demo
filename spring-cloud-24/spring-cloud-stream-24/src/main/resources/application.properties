server.port=7780
spring.application.name=spring-cloud-stream-demo

spring.cloud.function.definition=demoConsumer
spring.cloud.stream.bindings.demoConsumer-in-0.destination=demo-topic
spring.cloud.stream.bindings.demoConsumer-in-0.group=demo-group
spring.cloud.stream.bindings.demo-topic-out-0.destination=demo-topic

spring.cloud.stream.kafka.binder.brokers=localhost:9092

management.endpoints.web.exposure.include=health,info
