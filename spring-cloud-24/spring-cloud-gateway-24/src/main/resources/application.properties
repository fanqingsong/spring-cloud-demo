server.port=9876
spring.application.name=spring-cloud-gateway

spring.config.import=optional:configserver:http://config:config-secret@localhost:8888

eureka.client.service-url.defaultZone=http://roncoo:123456@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

spring.cloud.gateway.routes[0].id=provider-api
spring.cloud.gateway.routes[0].uri=lb://spring-cloud-provider
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**

spring.cloud.gateway.routes[1].id=consumer-feign
spring.cloud.gateway.routes[1].uri=lb://spring-cloud-consumer
spring.cloud.gateway.routes[1].predicates[0]=Path=/feign/**

management.endpoints.web.exposure.include=health,info
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
