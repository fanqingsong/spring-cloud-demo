# server
server.port=8888

# spring
spring.application.name=spring-cloud-consumer

# eureka
#eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.serviceUrl.defaultZone=http://roncoo:123456@localhost:8761/eureka/

# info自定义
info.build.name=@project.name@
info.build.description=@project.description@
info.build.groupId=@project.groupId@
info.build.artifact=@project.artifactId@
info.build.version=@project.version@

eureka.instance.status-page-url-path=/info
eureka.instance.instanceId=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

#设置拉取服务注册信息时间，默认60s
eureka.client.registry-fetch-interval-seconds=30

#指定续约更新频率，默认是30s
eureka.instance.lease-renewal-interval-in-seconds=15

#设置过期剔除时间，默认90s
eureka.instance.lease-expiration-duration-in-seconds=45

#设置策略
spring-cloud-provider.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RandomRule
spring-cloud-provider2.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RandomRule
#spring-cloud-provider.ribbon.NFLoadBalancerRuleClassName=com.roncoo.education.configuration.RoncooCustomRule
#格式为：应用名.ribbon.NFLoadBalancerRuleClassName=xxx

# 日志配置，默认是不打印任何的日志
logging.level.com.roncoo.education.feign=debug

# 开启压缩
feign.compression.request.enabled=true
feign.compression.response.enabled=true
# 更多配置
feign.compression.request.mime-types=text/xml,application/xml,application/json
feign.compression.request.min-request-size=2048

# Resilience4j 熔断阈值（实例名必须与 @CircuitBreaker(name = "getUser") 一致）
# 最近 10 次调用里统计；至少 5 次才开始算失败率，避免刚启动就跳闸
resilience4j.circuitbreaker.instances.getUser.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.getUser.sliding-window-size=10
resilience4j.circuitbreaker.instances.getUser.minimum-number-of-calls=5
# 失败率 >= 50% 打开熔断；打开后等 10s 进入半开，放 3 个探测请求
resilience4j.circuitbreaker.instances.getUser.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.getUser.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.getUser.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.getUser.automatic-transition-from-open-to-half-open-enabled=true
# 超过 2s 算慢调用，慢调用占比到 80% 同样跳闸
resilience4j.circuitbreaker.instances.getUser.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.getUser.slow-call-rate-threshold=80

