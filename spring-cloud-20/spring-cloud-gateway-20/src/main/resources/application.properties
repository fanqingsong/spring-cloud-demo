# server
server.port=9876
	
# spring
spring.application.name=spring-cloud-gateway

# eureka
#eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.serviceUrl.defaultZone=http://roncoo:123456@localhost:8761/eureka/

# info自定义
info.build.name=@project.name@
info.build.description=@project.description@
info.build.groupId=@project.groupId@
info.build.artifact=@project.artifactId@
info.build.version=@project.version@

eureka.instance.status-page-url-path=/info
eureka.instance.instanceId=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

#设置拉取服务注册信息时间，默认60s
eureka.client.registry-fetch-interval-seconds=30

#指定续约更新频率，默认是30s
eureka.instance.lease-renewal-interval-in-seconds=15

#设置过期剔除时间，默认90s
eureka.instance.lease-expiration-duration-in-seconds=45

# Spring Cloud Gateway 路由（lb:// 服务名须与 Eureka 注册名一致）
# Provider：/api/user/1 等
spring.cloud.gateway.routes[0].id=provider-api
spring.cloud.gateway.routes[0].uri=lb://spring-cloud-provider
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**

# Consumer：Feign 演示 /feign/user/{id}
spring.cloud.gateway.routes[1].id=consumer-feign
spring.cloud.gateway.routes[1].uri=lb://spring-cloud-consumer2
spring.cloud.gateway.routes[1].predicates[0]=Path=/feign/**

# Consumer：RestTemplate 演示 /user/{id}（与直接访问 8886 相同路径）
spring.cloud.gateway.routes[2].id=consumer-user
spring.cloud.gateway.routes[2].uri=lb://spring-cloud-consumer2
spring.cloud.gateway.routes[2].predicates[0]=Path=/user/**

spring.cloud.gateway.httpclient.connect-timeout=60000
spring.cloud.gateway.httpclient.response-timeout=60s
