# Docker Compose 演示（本课）
# 在仓库根目录或本课目录执行：
#   docker compose up --build -d
# 停止并清理：
#   docker compose down -v
#
# 监控：原 Turbine/Hystrix 聚合已过时；本 Compose 附带业界常用替代
#   Micrometer（应用内） + Prometheus（拉取 /actuator/prometheus） + Grafana（可视化）
#   Prometheus: http://localhost:9090  Grafana: http://localhost:3000 （admin / admin）

name: spring-cloud-19

services:
  eureka:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-19
        MODULE: spring-cloud-service-19
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://roncoo:123456@eureka:8761/eureka/"
      EUREKA_CLIENT_SERVICEURL_RONCOOZONE: "http://roncoo:123456@eureka:8761/eureka/"
      SPRING_SECURITY_USER_NAME: roncoo
      SPRING_SECURITY_USER_PASSWORD: 123456
    ports:
      - "8761:8761"

  provider:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-19
        MODULE: spring-cloud-provider-19
    environment:
      EUREKA_INSTANCE_PREFERIPADDRESS: true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://roncoo:123456@eureka:8761/eureka/"
      EUREKA_CLIENT_SERVICEURL_RONCOOZONE: "http://roncoo:123456@eureka:8761/eureka/"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    depends_on:
      eureka:
        condition: service_started
    ports:
      - "7778:7778"
    restart: unless-stopped

  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-19
        MODULE: spring-cloud-consumer-19
    environment:
      EUREKA_INSTANCE_PREFERIPADDRESS: true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://roncoo:123456@eureka:8761/eureka/"
      EUREKA_CLIENT_SERVICEURL_RONCOOZONE: "http://roncoo:123456@eureka:8761/eureka/"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    depends_on:
      eureka:
        condition: service_started
    ports:
      - "8886:8886"
    restart: unless-stopped

  turbine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-19
        MODULE: spring-cloud-turbine-19
    environment:
      EUREKA_INSTANCE_PREFERIPADDRESS: true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://roncoo:123456@eureka:8761/eureka/"
      EUREKA_CLIENT_SERVICEURL_RONCOOZONE: "http://roncoo:123456@eureka:8761/eureka/"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    depends_on:
      eureka:
        condition: service_started
    ports:
      - "9999:9999"
    restart: unless-stopped

  prometheus:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      provider:
        condition: service_started
      consumer:
        condition: service_started
      turbine:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
