server.port=7777

spring.application.name=spring-cloud-27-provider

spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.server-addr=${spring.cloud.nacos.server-addr}
spring.cloud.nacos.discovery.weight=${NACOS_DISCOVERY_WEIGHT:1}

provider.instance-label=${PROVIDER_INSTANCE_LABEL:provider-default}

management.endpoints.web.exposure.include=health,info
