# Docker Compose 演示（本课）
# 在仓库根目录或本课目录执行：
#   docker compose up --build -d
# 停止并清理：
#   docker compose down -v

name: spring-cloud-02

services:
  eureka:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-02
        MODULE: spring-cloud-02-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    ports:
      - "8761:8761"
    # 等 Tomcat / Eureka HTTP 真正起来，避免客户端首拉注册表 Connection refused
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/eureka/apps >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  provider:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-02
        MODULE: spring-cloud-02-provider
    environment:
      EUREKA_INSTANCE_PREFERIPADDRESS: true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
    depends_on:
      eureka:
        condition: service_healthy
    ports:
      - "7777:7777"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7777/api/hello >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        LESSON: spring-cloud-02
        MODULE: spring-cloud-02-consumer
    environment:
      EUREKA_INSTANCE_PREFERIPADDRESS: true
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka:8761/eureka/"
      # 缩短拉取间隔，避免首拉失败后默认等 30s 才看到 Provider
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: 5
    depends_on:
      eureka:
        condition: service_healthy
      provider:
        condition: service_healthy
    ports:
      - "8888:8888"
    restart: unless-stopped
